<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 1200 570" width="1200" height="570"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101629"/><stop offset="1" stop-color="#20234b"/></linearGradient><linearGradient id="purple" x2="1" y2="1"><stop stop-color="#7655d7"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><linearGradient id="green" x2="1" y2="1"><stop stop-color="#208767"/><stop offset="1" stop-color="#41cf9b"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6" fill="none" stroke="#c9c5ef" stroke-width="2"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#f7f7ff}.title{font-size:29px;font-weight:bold}.sub{font-size:17px;fill:#c4c7e1}.tag{font-size:17px;font-weight:bold}.small{font-size:15px;fill:#e2e2f2}.box{fill:#222b47;stroke:#515b7b;stroke-width:1.5}.line{fill:none;stroke:#c9c5ef;stroke-width:3;marker-end:url(#arrow)}.muted{fill:#8f98b6}</style><rect width="100%" height="100%" fill="url(#bg)"/><text x="600" y="58" class="title" text-anchor="middle">Two ways to describe a changing interface</text><rect x="60" y="88" width="510" height="418" rx="17" fill="#1d2741" stroke="#515b7b" stroke-width="1.5"/><rect x="85" y="110" width="7" height="35" rx="4" fill="#b89afb"/><text x="106" y="136" class="tag" text-anchor="start">IMPERATIVE</text><rect x="630" y="88" width="510" height="418" rx="17" fill="#1d2741" stroke="#515b7b" stroke-width="1.5"/><rect x="655" y="110" width="7" height="35" rx="4" fill="#50d6a6"/><text x="676" y="136" class="tag" text-anchor="start">DECLARATIVE</text><rect x="97" y="165" width="225" height="57" rx="11" fill="#303955" stroke="#515b7b" stroke-width="1.5"/><text x="208" y="187" class="tag" text-anchor="middle">1. User taps</text><text x="208" y="208" class="sub" text-anchor="middle">Follow</text><path class="line" d="M208 223 L208 236"/><rect x="97" y="241" width="225" height="57" rx="11" fill="#303955" stroke="#515b7b" stroke-width="1.5"/><text x="208" y="263" class="tag" text-anchor="middle">2. Change data</text><text x="208" y="284" class="sub" text-anchor="middle">isFollowing = true</text><path class="line" d="M208 299 L208 312"/><rect x="97" y="317" width="225" height="57" rx="11" fill="#303955" stroke="#515b7b" stroke-width="1.5"/><text x="208" y="339" class="tag" text-anchor="middle">3. Set label</text><text x="208" y="360" class="sub" text-anchor="middle">button.setTitle(...)</text><path class="line" d="M208 375 L208 388"/><rect x="97" y="393" width="225" height="57" rx="11" fill="#303955" stroke="#515b7b" stroke-width="1.5"/><text x="208" y="415" class="tag" text-anchor="middle">4. Update style</text><text x="208" y="436" class="sub" text-anchor="middle">button.tintColor = ...</text><rect x="397" y="266" width="135" height="96" rx="15" fill="#3d2d70" stroke="#8066d5" stroke-width="1.5"/><text x="464" y="300" class="title" text-anchor="middle">UI</text><text x="464" y="328" class="sub" text-anchor="middle">manually</text><path class="line" d="M324 352 L390 315"/><rect x="675" y="196" width="181" height="98" rx="13" fill="#293c50" stroke="#51b896" stroke-width="1.5"/><text x="765" y="233" class="tag" text-anchor="middle">STATE</text><text x="765" y="259" class="small" text-anchor="middle">isFollowing</text><text x="765" y="278" class="small" text-anchor="middle">= true</text><path class="line" d="M860 244 L951 244"/><rect x="960" y="180" width="135" height="145" rx="17" fill="#382e68" stroke="#8066d5" stroke-width="1.5"/><text x="1027" y="211" class="title" text-anchor="middle">UI</text><rect x="977" y="235" width="101" height="48" rx="14" fill="url(#green)" stroke="#79f0bd" stroke-width="1.5"/><text x="1027" y="264" class="small" text-anchor="middle">Following</text><text x="885" y="376" class="title" text-anchor="middle">UI = f(state)</text><text x="885" y="408" class="sub" text-anchor="middle">Describe the result.</text><text x="885" y="434" class="sub" text-anchor="middle">The framework updates it.</text><text x="600" y="545" class="sub" text-anchor="middle">Same interaction • Different ownership of UI updates</text></svg>